spring:
  application:
    name: embabel-loan-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

embabel:
  agent:
    platform:
      log-prompts: false      # set to true to see full prompts
      log-responses: false    # set to true to see full LLM responses

logging:
  level:
    com.embabel: INFO
    com.engineerinai: INFO    # shows our BlackboardLogger output
  pattern:
    console: "%d{HH:mm:ss} %highlight(%-5level) %cyan(%-30logger{30}) - %msg%n"
